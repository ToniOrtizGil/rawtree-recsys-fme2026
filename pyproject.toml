[project]
name = "rtrec"
version = "0.1.0"
description = "Real-time recommender for the RawTree challenge, Datathon FME 2026"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter"]
sql = ["chdb>=3"]   # embedded ClickHouse: runs rtrec/sql offline (tests skip without it)

[tool.setuptools.packages.find]
include = ["rtrec*", "sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
