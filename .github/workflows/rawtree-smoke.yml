name: RawTree smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rawtree-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEAM_ID: team_36
      RAWTREE_API_KEY: ${{ secrets.RAWTREE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Verify secret is configured
        shell: bash
        run: |
          if [ -z "$RAWTREE_API_KEY" ]; then
            echo "::error::Add the new key as the repository Actions secret RAWTREE_API_KEY."
            exit 1
          fi

      - name: Check RawTree access
        run: python ops/smoke_rawtree.py